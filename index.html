<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d70015" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#8a0010" media="(prefers-color-scheme: dark)">
<title>頭文字D THE ARCADE 楽曲プレーヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--line:#e3e3e8;--fg:#1d1d1f;--mute:#6e6e73;--ac:#d70015;--hl:#fff1a8;color-scheme:light dark;--sel:#fdecee;--barbg:rgba(255,255,255,.96);--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--bg2:#1e1e22;--line:#2f2f35;--fg:#f2f2f4;--mute:#a0a0a8;--ac:#ff5a67;--hl:#6b5b00;--sel:#3a1519;--barbg:rgba(18,18,20,.96);--err:#ff7b6b}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5;padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero .in{max-width:860px;margin:0 auto;padding:max(28px,env(safe-area-inset-top,0px)) 12px 8px}
h1{margin:0;font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:24px;font-weight:400;letter-spacing:.02em}
.lede{margin:4px 0 0;color:var(--mute);font-size:14px}
.tools{max-width:860px;margin:0 auto;padding:12px 12px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tools input{flex:1 1 220px;min-width:0}
.tools select{flex:0 1 auto;max-width:100%}
.cnt{width:100%;margin:2px 0 0;font-size:12px;color:var(--mute)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
main{max-width:860px;margin:0 auto;padding:0 12px}
ol{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:36px 44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px;cursor:pointer}
.row:hover{background:var(--bg2)}
.row.on{background:var(--sel)}
.no{font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.row.on .no{color:var(--ac)}
.t{display:block;font-weight:900;overflow-wrap:anywhere}
.row.on .t{color:var(--ac)}
.a{display:block;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.cv{width:44px;aspect-ratio:288/336;object-fit:cover;background:var(--line);display:block;border-radius:4px}
.empty{padding:32px 0;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--barbg);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:0 12px calc(4px + env(safe-area-inset-bottom,0px))}
.in2{max-width:860px;margin:0 auto;position:relative;z-index:1}
.seek{position:absolute;left:-12px;right:-12px;top:-16px;height:34px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.seek::before{content:"";position:absolute;left:12px;right:12px;top:15px;height:4px;border-radius:2px;background:var(--line)}
.trk{position:absolute;left:12px;right:12px;top:0;bottom:0;pointer-events:none}
.fill{position:absolute;left:0;top:15px;height:4px;width:0;border-radius:2px;background:var(--ac)}
.dot{position:absolute;top:10px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ac);transform:scale(.6);transition:transform .08s}
.seek.drag .dot{transform:scale(1.5)}
.seek.drag::before,.seek.drag .fill{top:14px;height:6px}
.pl{display:flex;flex-direction:column;gap:2px;padding-top:12px}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.pl .cv{width:46px;flex:none}
.pl .cv[hidden]{display:none}
.now{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.tt{flex:1;min-width:0}
.now b{display:block;font-weight:900;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now small{display:block;color:var(--mute);font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now small:empty{display:none}
.now span{flex:none;white-space:nowrap;color:var(--mute);font-family:Orbitron,sans-serif;font-size:11px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.ctl button{background:none;border:0;width:46px;height:48px;cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.ctl button.tg{color:var(--mute);width:38px}
.ctl button.tg[aria-pressed=true]{color:var(--ac)}
.ctl button.main{width:50px;height:50px;margin:0 2px;background:#d70015;color:#fff;border-radius:50%}
.ctl button.main i{font-size:19px}
.ctl i{font-size:18px;display:inline-block}
#rep{position:relative}
#rep::after{content:"1";position:absolute;right:7px;bottom:9px;font:700 8px system-ui,sans-serif}
#msg{color:var(--err);font-size:12px;margin:0;text-align:center}
#msg:empty{display:none}
@media (max-width:380px){.ctl{gap:2px}}
</style>
</head>
<body>
<header class="hero"><div class="in">
  <h1>頭文字D THE ARCADE 楽曲プレーヤー</h1>
  <p class="lede">曲を選ぶと再生が始まり、終わると次の曲へ進みます。</p>
</div></header>
<div class="tools">
  <input id="q" type="search" placeholder="曲名・アーティスト・番号（スペースで複数指定）" aria-label="曲を検索">
  <select id="ser" aria-label="シリーズで絞り込む"><option value="">すべてのシリーズ</option></select>
  <p class="cnt" id="cnt" role="status"></p>
</div>
<main><ol id="list"></ol><p class="empty" id="empty" hidden>該当する曲がありません。検索語を変えてください。</p></main>

<div class="bar"><div class="in2">
  <div class="seek" id="seek" role="slider" aria-label="再生位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="trk"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div></div>
  <div class="pl">
    <div class="top">
      <img id="pcv" class="cv" alt="" hidden>
      <div class="now"><div class="tt"><b id="nt">曲を選んでください</b><small id="na"></small></div><span id="tm">0:00 / 0:00</span></div>
    </div>
    <div class="ctl">
      <button id="shuf" class="tg" aria-pressed="false" aria-label="シャッフル" title="シャッフル"><i class="fa-solid fa-shuffle" aria-hidden="true"></i></button>
      <button id="prev" aria-label="前の曲"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
      <button id="play" class="main" aria-label="再生"><i class="fa-solid fa-play" id="ic" aria-hidden="true"></i></button>
      <button id="next" aria-label="次の曲"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
      <button id="rep" class="tg" aria-pressed="false" aria-label="1曲リピート" title="1曲リピート"><i class="fa-solid fa-repeat" aria-hidden="true"></i></button>
    </div>
  </div>
  <p id="msg" role="status"></p>
</div></div>
<audio id="au" preload="metadata"></audio>

<script>
const RAW=`01|Dive into the SPEED|A-One Vo: AXEL.K|01
02|Waiting for you|A-One Vo: Shihori|01
03|Starlight Spada|A-One Vo: Rute|01

30|PRESERVED VAMPIRE|SOUND HOLIC Vo: Nana Takahashi|02
31|HEARTSTRINGS|DiGiTAL WiNG Vo: 花たん|02
32|No Life Queen (DJ Command Remix)|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi|02
33|DARTH KILLER|SOUND HOLIC Vo: Nana Takahashi / 709sec.|02
34|Grip & Break down !!|SOUND HOLIC Vo: Nana Takahashi|02
35|Don't Break Me Down|A-One Vo: AXEL.K|02
36|DEEP IN THE HEATWAVE|SOUND HOLIC Vo: 小寺可南子|01
37|ロミオとシンデレラ|doriko Vo: 初音ミク|05
38|ネトゲ廃人シュプレヒコール|さつき が てんこもり Vo: 初音ミク|05
39|テオ|Omoi Vo: 初音ミク|05
40|ロストワンの号哭|Neru Vo: 鏡音リン|05
41|孤独の果て|光収容 Vo: 鏡音リン|05
42|右肩の蝶|のりぴー Vo: 鏡音レン|05
43|ルカルカ★ナイトフィーバー|samfree Vo: 巡音ルカ|05

52|Set Me Free Babe|Richard Cottle|07
53|God Bless You!!|A-One Vo: NAGISA|02

55|Veiling Shooter|A-One Vo: 花たん|02

57|GET IN THE GROOVE|DJ Command(Eurobeat Union) feat. Okogeeechann|02
58|SOUL 2 DIVIDE|SOUND HOLIC vs ZYTOKINE Vo: 星野奏子|02
59|00 HEAVEN|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi / 709sec.|02
60|Death Blossom|REDALiCE feat. 野宮あゆみ|02
61|Necrophantasia|SOUND HOLIC Vo: YURiCa / 花たん|02
62|Wandering Soul|DiGiTAL WiNG with 空音|02
63|New Starlight|DiGiTAL WiNG Vo: 空音|01
64|Catch the Wave|livetune Vo: 初音ミク|05
65|ロキ|みきとP Vo: 鏡音リン / みきとP|05
66|ダブルラリアット|アゴアニキ Vo: 巡音ルカ|05
67|VANTAGE POINT|SOUND HOLIC feat. Nana Takahashi|01
68|LUNATIC DOLL|DJ Command (Eurobeat Union) Vo: Cocoa|02

70|sweet little sister|Silver Forest Vo: さゆり|02
77|Dark Diver|emon(Tes.) Vo: ねんね|06
78|C & B|PSYQUI Vo: Such|06
79|MUSIC PЯAYER|A-One Vo: Rute / あき|06
80|Elusive Enforcer|K-forest vs. Reku Mochizuki|06
86|Chasing Rain|DiGiTAL WiNG Vo: ふうか、空音 / RAP: ytr|01
87|KATANA|A-One Vo: みぃ|01
88|Through the rain|Xceon Vo: Kanae Asaba|01
89|My initial|Xceon Vo: 小林真奈|01
93|EXIT|Command (Eurobeat Union) Vo: Iori|01
L01|JUNGLE FIRE feat. MOTSU|芹澤 優|08
L02|うまぴょい伝説|本田晃弘(Cygames) Vo: スペシャルウィーク、サイレンススズカ、トウカイテイオー|09`;

const SER={"01":"THE ARCADE オリジナル","02":"東方","03":"Dave Rodgers","04":"20th Anniversary","05":"VOCALOID","06":"CHUNITHM","07":"Hot-Version","08":"MF Ghost","09":"ウマ娘"};
function nrm(s){let n="",map=[];for(let i=0;i<s.length;i++){const c=s[i].normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,x=>String.fromCharCode(x.charCodeAt(0)-96));for(const ch of c){n+=ch;map.push(i)}}return {n,map}}
function hl(el,text,terms){
  const {n,map}=nrm(text),r=[];
  terms.forEach(w=>{for(let k=n.indexOf(w);k>=0;k=n.indexOf(w,k+w.length)) r.push([map[k],map[k+w.length-1]+1])});
  r.sort((a,b)=>a[0]-b[0]);let p=0;
  for(const [a,b] of r){ if(b<=p) continue; const s0=Math.max(a,p);
    if(s0>p) el.append(text.slice(p,s0)); const m=document.createElement("mark"); m.textContent=text.slice(s0,b); el.append(m); p=b; }
  el.append(text.slice(p));
}
const T=RAW.split("\n").map(l=>{const [no,title,artist,j,file]=l.split("|");
  const label=no[0]==="L"?"LIMITED"+no.slice(1):no;
  return {no,j,hay:nrm(no+" "+title+" "+artist+" "+SER[j]).n,no,title,artist,cv:"artwork/T_Common_CDJacket_"+j+"_Big.png",fn:file||label+"_"+title+".mp3"};});
const $=id=>document.getElementById(id), au=$("au"), list=$("list");
const MS="mediaSession" in navigator ? navigator.mediaSession : null;
// ロック画面・コントロールセンター・Bluetooth機器などに曲情報を渡す
function setMeta(t){
  if(!MS||!window.MediaMetadata) return;
  MS.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:"頭文字D THE ARCADE",
    artwork:[{src:new URL(t.cv,location.href).href,sizes:"288x336",type:"image/png"}]});
}
if(MS){
  const h=(a,f)=>{try{MS.setActionHandler(a,f)}catch(e){}};
  h("play",()=>au.play()); h("pause",()=>au.pause());
  h("previoustrack",()=>$("prev").click()); h("nexttrack",()=>step(1));
  h("seekto",d=>{au.currentTime=d.seekTime});
}
let tried=0, vis=[], cur=-1, shuffle=false, repeat=false;

function render(){
  const terms=nrm($("q").value.trim()).n.split(/\s+/).filter(Boolean), sr=$("ser").value;
  list.textContent=""; vis=[];
  T.forEach((t,i)=>{
    if(sr && t.j!==sr) return;
    if(!terms.every(x=>t.hay.includes(x))) return;
    vis.push(i); const li=document.createElement("li"), b=document.createElement("button");
    b.className="row"+(i===cur?" on":""); b.dataset.i=i;
    b.innerHTML='<span class="no"></span><img class="cv" loading="lazy" alt=""><span><span class="t"></span><span class="a"></span></span>';
    b.children[0].textContent=t.no; b.children[1].src=t.cv; b.children[1].onerror=function(){this.style.visibility="hidden"};
    hl(b.querySelector(".t"),t.title,terms); hl(b.querySelector(".a"),t.artist,terms);
    b.onclick=()=>play(i); li.appendChild(b); list.appendChild(li);
  });
  $("cnt").textContent=(terms.length||sr)?vis.length+"曲が見つかりました（全"+T.length+"曲中）":"全"+T.length+"曲";
  $("empty").hidden=vis.length>0;
}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function icon(p){$("ic").className=p?"fa-solid fa-pause":"fa-solid fa-play";$("play").setAttribute("aria-label",p?"一時停止":"再生")}
// 濁点付き文字は保存環境により NFC / NFD どちらの名前にもなるため、両方を順に試す
function srcOf(t,k){const f=[t.fn,t.fn.normalize("NFD"),t.fn.normalize("NFC")].filter((v,i,a)=>a.indexOf(v)===i);return k<f.length?"songs/"+encodeURIComponent(f[k]):null}
function play(i){
  cur=i; tried=0; const t=T[i]; $("msg").textContent=""; au.src=srcOf(t,0); au.play().catch(()=>{});
  $("nt").textContent=t.no+"  "+t.title; $("na").textContent=t.artist; $("pcv").src=t.cv; $("pcv").hidden=false; setMeta(t);
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",+r.dataset.i===i));
  const on=document.querySelector(".row.on"); if(on) on.scrollIntoView({block:"nearest"});
}
function step(d){
  const L=vis.length?vis:T.map((_,i)=>i);
  if(shuffle && d>0){let j;do{j=L[Math.floor(Math.random()*L.length)]}while(j===cur&&L.length>1);play(j);return}
  let p=L.indexOf(cur); p=p<0?(d>0?0:L.length-1):(p+d+L.length)%L.length; play(L[p]);
}
$("play").onclick=()=>{ if(cur<0) play(0); else au.paused?au.play():au.pause() };
$("next").onclick=()=>step(1);
$("prev").onclick=()=>{ if(au.currentTime>3) au.currentTime=0; else step(-1) };
$("shuf").onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute("aria-pressed",shuffle)};
$("rep").onclick=e=>{repeat=!repeat;e.currentTarget.setAttribute("aria-pressed",repeat)};
Object.entries(SER).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v;$("ser").appendChild(o)});
$("q").oninput=render; $("ser").onchange=render;
$("q").onkeydown=e=>{ if(e.key==="Escape"){e.target.value="";render()} };
au.onplay=()=>{icon(true);if(MS)MS.playbackState="playing"}; au.onpause=()=>{icon(false);if(MS)MS.playbackState="paused"};
au.onended=()=>{ if(repeat){au.currentTime=0;au.play()} else step(1) };
au.onerror=()=>{
  if(cur<0) return; const t=T[cur], n=srcOf(t,tried+1);
  if(n){ tried++; au.src=n; au.play().catch(()=>{}); return }
  $("msg").textContent="曲を読み込めません。songs フォルダに「"+t.fn+"」があるか確認してください。";
};
let drag=false;
function paint(p){$("fill").style.width=p+"%";$("dot").style.left=p+"%";$("seek").setAttribute("aria-valuenow",Math.round(p))}
au.ontimeupdate=()=>{
  if(drag) return;
  paint(au.duration?au.currentTime/au.duration*100:0);
  $("tm").textContent=fmt(au.currentTime)+" / "+fmt(au.duration);
  if(MS&&au.duration) try{MS.setPositionState({duration:au.duration,position:au.currentTime,playbackRate:au.playbackRate})}catch(e){}
};
function frac(e){const r=$("seek").querySelector(".trk").getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function follow(e){ // 指の位置に即追従(表示は即時、音は離したときに反映)
  const f=frac(e); paint(f*100); if(au.duration) $("tm").textContent=fmt(f*au.duration)+" / "+fmt(au.duration); return f;
}
const sk=$("seek");
sk.onpointerdown=e=>{drag=true;sk.classList.add("drag");sk.setPointerCapture(e.pointerId);follow(e)};
sk.onpointermove=e=>{if(drag)follow(e)};
const end=e=>{if(!drag)return;const f=follow(e);drag=false;sk.classList.remove("drag");if(au.duration)au.currentTime=f*au.duration};
sk.onpointerup=end;
sk.onpointercancel=()=>{drag=false;sk.classList.remove("drag")};
sk.onkeydown=e=>{ if(e.key==="ArrowRight")au.currentTime+=5; if(e.key==="ArrowLeft")au.currentTime-=5 };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&e.target===document.body){e.preventDefault();$("q").focus()} if(e.code==="Space"&&e.target===document.body){e.preventDefault();$("play").click()} });
render();
</script>
</body>
</html>
