<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>頭文字D THE ARCADE 楽曲プレーヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--bk:#0a0a0c;--bk2:#131316;--bk3:#1c1c21;--line:#2e2e35;--wh:#f4f4f2;--mute:#9a9aa3;--red:#e60012;--yel:#ffd400;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bk);color:var(--wh);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
 background-image:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.018) 46px 48px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.hero{position:relative;overflow:hidden;border-bottom:3px solid var(--red);background:linear-gradient(100deg,#000 0 55%,#1a0004 100%)}
.hero::before{content:"";position:absolute;right:-8%;top:0;bottom:0;width:46%;background:repeating-linear-gradient(115deg,var(--red) 0 14px,transparent 14px 34px,var(--yel) 34px 40px,transparent 40px 70px);opacity:.9;transform:skewX(-14deg);clip-path:polygon(0 0,100% 0,100% 100%,18% 100%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 45%,rgba(0,0,0,.2) 80%,transparent)}
.hero .in{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:max(36px,env(safe-area-inset-top,0px)) 20px 26px}
.tag{display:inline-block;background:var(--yel);color:#000;font-family:Orbitron,sans-serif;font-weight:900;font-size:11px;letter-spacing:.2em;padding:3px 12px 3px 10px;transform:skewX(-14deg)}
.tag span{display:inline-block;transform:skewX(14deg)}
h1{margin:12px 0 0;font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-style:italic;line-height:1;transform:skewX(-8deg);transform-origin:left bottom}
h1 .d{display:block;font-size:clamp(40px,11vw,84px);color:var(--wh);text-shadow:3px 3px 0 var(--red)}
h1 .d i{color:var(--red);font-style:italic;text-shadow:3px 3px 0 #fff3}
h1 .a{display:block;font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(22px,6.4vw,46px);letter-spacing:.12em;color:var(--yel);margin-top:6px}
.lede{margin:16px 0 0;max-width:34ch;color:#d6d6da;font-size:14px;font-weight:700}
.lede em{font-style:normal;color:var(--yel)}
.tools{max-width:860px;margin:0 auto;padding:18px 20px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--bk2);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:0;padding:10px 12px}
.tools input{flex:1 1 220px;min-width:0}
.tools select{flex:0 1 auto;max-width:100%}
.cnt{width:100%;margin:2px 0 0;font-size:12px;color:var(--mute);font-family:Orbitron,"Zen Kaku Gothic New",sans-serif;letter-spacing:.04em}
mark{background:var(--yel);color:#000;padding:0 1px}
main{max-width:860px;margin:0 auto;padding:0 20px}
ol{list-style:none;margin:0;padding:0}
.row{position:relative;display:grid;grid-template-columns:48px 44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px 10px 0;cursor:pointer}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transform:skewX(-14deg)}
.row:hover{background:linear-gradient(90deg,var(--bk3),transparent)}
.row.on{background:linear-gradient(90deg,rgba(230,0,18,.28),transparent 80%)}
.row.on::before{background:var(--red);box-shadow:0 0 12px var(--red)}
.no{font-family:Orbitron,sans-serif;font-weight:900;font-size:16px;text-align:right;color:var(--mute);font-style:italic}
.row.on .no{color:var(--yel)}
.t{display:block;font-weight:900;overflow-wrap:anywhere}
.a{display:block;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.cv{width:44px;aspect-ratio:288/336;object-fit:cover;background:var(--line);display:block;clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,0 100%)}
.empty{padding:32px 0;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(10,10,12,.96);backdrop-filter:blur(8px);border-top:2px solid var(--red);padding:0 12px calc(6px + env(safe-area-inset-bottom,0px))}
.in2{max-width:860px;margin:0 auto}
.seek{position:relative;height:16px;cursor:pointer;touch-action:none}
.seek::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;background:var(--line)}
.fill{position:absolute;left:0;top:6px;height:3px;width:0;background:linear-gradient(90deg,var(--red),var(--yel))}
.dot{position:absolute;top:2px;left:0;width:10px;height:11px;margin-left:-5px;background:var(--yel);transform:skewX(-14deg);box-shadow:0 0 8px var(--yel)}
.pl{display:flex;align-items:center;gap:8px}
.pl .cv{width:34px;flex:none}
.pl .cv[hidden]{display:none}
.now{flex:1;min-width:0}
.now b{display:block;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now span{display:block;color:var(--mute);font-size:11px;font-family:Orbitron,sans-serif;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:2px;flex:none}
.ctl button{background:none;border:0;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:var(--wh)}
.ctl button.tg{color:var(--mute)}
.ctl button.tg[aria-pressed=true]{color:var(--yel);filter:drop-shadow(0 0 5px var(--yel))}
.ctl button.main{width:42px;height:38px;margin:0 3px;background:var(--red);transform:skewX(-14deg);box-shadow:0 0 12px rgba(230,0,18,.6)}
.ctl button.main i{transform:skewX(14deg)}
.ctl i{font-size:16px;display:inline-block}
#rep{position:relative}
#rep::after{content:"1";position:absolute;right:5px;bottom:4px;font:900 8px Orbitron,sans-serif}
#msg{color:var(--yel);font-size:11px;margin:0;min-height:0;text-align:center}
#msg:empty{display:none}
@media (max-width:380px){.pl .cv{display:none}.ctl button{width:30px}}
</style>
</head>
<body>
<header class="hero"><div class="in">
  <div class="tag"><span>EUROBEAT NON-STOP</span></div>
  <h1><span class="d">頭文字<i>D</i></span><span class="a">THE ARCADE</span></h1>
  <p class="lede">深夜の峠を駆け抜ける<em>ユーロビート</em>を、ここで全開に。曲を選べばそのままノンストップ。</p>
</div></header>
<div class="tools">
  <input id="q" type="search" placeholder="曲名・アーティスト・番号（スペースで複数指定）" aria-label="曲を検索">
  <select id="ser" aria-label="シリーズで絞り込む"><option value="">すべてのシリーズ</option></select>
  <p class="cnt" id="cnt" role="status"></p>
</div>
<main><ol id="list"></ol><p class="empty" id="empty" hidden>該当する曲がありません。検索語を変えてください。</p></main>

<div class="bar"><div class="in2">
  <div class="seek" id="seek" role="slider" aria-label="再生位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
  <div class="pl">
    <img id="pcv" class="cv" alt="" hidden>
    <div class="now"><b id="nt">曲を選んでください</b><span id="tm">0:00 / 0:00</span></div>
    <div class="ctl">
      <button id="shuf" class="tg" aria-pressed="false" aria-label="シャッフル" title="シャッフル"><i class="fa-solid fa-shuffle" aria-hidden="true"></i></button>
      <button id="prev" aria-label="前の曲"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
      <button id="play" class="main" aria-label="再生"><i class="fa-solid fa-play" id="ic" aria-hidden="true"></i></button>
      <button id="next" aria-label="次の曲"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
      <button id="rep" class="tg" aria-pressed="false" aria-label="1曲リピート" title="1曲リピート"><i class="fa-solid fa-repeat" aria-hidden="true"></i></button>
    </div>
  </div>
  <p id="msg" role="status"></p>
</div></div>
<audio id="au" preload="metadata"></audio>

<script>
const RAW=`01|Dive into the SPEED|A-One Vo: AXEL.K|01
02|Waiting for you|A-One Vo: Shihori|01
03|Starlight Spada|A-One Vo: Rute|01
04|Don't stop your way|A-One Vo: あき|01
05|Good Energy Flow|A-One Vo: Nene|01
06|Super Sonic|A-One Vo: 光吉猛修|01
07|High Speed Live|A-One Vo: さちぶどう|01

21|TOFU CONNECTION|Dave Rodgers|03

24|IGNITE THE POWER|SOUND HOLIC Vo: STEVIE(44MAGNUM)|01
25|Chase The Ghost|Sachi@SEGA|01
26|BURN INSIDE|TAKENOBU & KUNOICHI@SEGA|04
27|Endless Seeker|A-One Vo: Rute / あき|02
28|Fantastic World|A-One Vo: Rute|02
29|BEAT DOWN|A-One Vo: Rute|01
30|PRESERVED VAMPIRE|SOUND HOLIC Vo: Nana Takahashi|02
31|HEARTSTRINGS|DiGiTAL WiNG Vo: 花たん|02
32|No Life Queen (DJ Command Remix)|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi|02
33|DARTH KILLER|SOUND HOLIC Vo: Nana Takahashi / 709sec.|02
34|Grip & Break down !!|SOUND HOLIC Vo: Nana Takahashi|02
35|Don't Break Me Down|A-One Vo: AXEL.K|02
36|DEEP IN THE HEATWAVE|SOUND HOLIC Vo: 小寺可南子|01
37|ロミオとシンデレラ|doriko Vo: 初音ミク|05
38|ネトゲ廃人シュプレヒコール|さつき が てんこもり Vo: 初音ミク|05
39|テオ|Omoi Vo: 初音ミク|05
40|ロストワンの号哭|Neru Vo: 鏡音リン|05
41|孤独の果て|光収容 Vo: 鏡音リン|05
42|右肩の蝶|のりぴー Vo: 鏡音レン|05
43|ルカルカ★ナイトフィーバー|samfree Vo: 巡音ルカ|05
44|ワールズエンド・ダンスホール|wowaka Vo: 初音ミク / 巡音ルカ|05
45|アカツキアライヴァル|Last Note. Vo: 初音ミク / 巡音ルカ|05
46|Asterist|DiGiTAL WiNG Vo: ふうか|01
47|PARAMETERS|DiGiTAL WiNG Vo: 沙|01
48|IMPACT|Usao feat.光吉猛修|06
49|POTENTIAL|TAG|06
50|We Gonna Journey|Queen P.A.L.|06
52|Set Me Free Babe|Richard Cottle|07
53|God Bless You!!|A-One Vo: NAGISA|02
54|Love Thief|CrazyBeats Vo: 加藤ありさ|02
55|Veiling Shooter|A-One Vo: 花たん|02
56|Twin Blade|A-One Vo: Rute / あき|01
57|GET IN THE GROOVE|DJ Command(Eurobeat Union) feat. Okogeeechann|02
58|SOUL 2 DIVIDE|SOUND HOLIC vs ZYTOKINE Vo: 星野奏子|02
59|00 HEAVEN|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi / 709sec.|02
60|Death Blossom|REDALiCE feat. 野宮あゆみ|02
61|Necrophantasia|SOUND HOLIC Vo: YURiCa / 花たん|02
62|Wandering Soul|DiGiTAL WiNG with 空音|02
63|New Starlight|DiGiTAL WiNG Vo: 空音|01
64|Catch the Wave|livetune Vo: 初音ミク|05
65|ロキ|みきとP Vo: 鏡音リン / みきとP|05
66|ダブルラリアット|アゴアニキ Vo: 巡音ルカ|05
67|VANTAGE POINT|SOUND HOLIC feat. Nana Takahashi|01
68|LUNATIC DOLL|DJ Command (Eurobeat Union) Vo: Cocoa|02
69|Tiara is gone|CrazyBeats Vo: KIHOW|02
70|sweet little sister|Silver Forest Vo: さゆり|02
77|Dark Diver|emon(Tes.) Vo: ねんね|06
78|C & B|PSYQUI Vo: Such|06
79|MUSIC PЯAYER|A-One Vo: Rute / あき|06
80|Elusive Enforcer|K-forest vs. Reku Mochizuki|06
L01|JUNGLE FIRE feat. MOTSU|芹澤 優|08`;

const SER={"01":"THE ARCADE オリジナル","02":"東方","03":"Dave Rodgers","04":"20th Anniversary","05":"VOCALOID","06":"CHUNITHM","07":"Hot-Version","08":"MF Ghost"};
function nrm(s){let n="",map=[];for(let i=0;i<s.length;i++){const c=s[i].normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,x=>String.fromCharCode(x.charCodeAt(0)-96));for(const ch of c){n+=ch;map.push(i)}}return {n,map}}
function hl(el,text,terms){
  const {n,map}=nrm(text),r=[];
  terms.forEach(w=>{for(let k=n.indexOf(w);k>=0;k=n.indexOf(w,k+w.length)) r.push([map[k],map[k+w.length-1]+1])});
  r.sort((a,b)=>a[0]-b[0]);let p=0;
  for(const [a,b] of r){ if(b<=p) continue; const s0=Math.max(a,p);
    if(s0>p) el.append(text.slice(p,s0)); const m=document.createElement("mark"); m.textContent=text.slice(s0,b); el.append(m); p=b; }
  el.append(text.slice(p));
}
const T=RAW.split("\n").map(l=>{const [no,title,artist,j]=l.split("|");
  const label=no[0]==="L"?"LIMITED"+no.slice(1):no;
  return {no,j,hay:nrm(no+" "+title+" "+artist+" "+SER[j]).n,no,title,artist,cv:"artwork/T_Common_CDJacket_"+j+"_Big.png",fn:label+"_"+title+".ogg"};});
const $=id=>document.getElementById(id), au=$("au"), list=$("list");
const MS="mediaSession" in navigator ? navigator.mediaSession : null;
// ロック画面・コントロールセンター・Bluetooth機器などに曲情報を渡す
function setMeta(t){
  if(!MS||!window.MediaMetadata) return;
  MS.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:"頭文字D THE ARCADE",
    artwork:[{src:new URL(t.cv,location.href).href,sizes:"288x336",type:"image/png"}]});
}
if(MS){
  const h=(a,f)=>{try{MS.setActionHandler(a,f)}catch(e){}};
  h("play",()=>au.play()); h("pause",()=>au.pause());
  h("previoustrack",()=>$("prev").click()); h("nexttrack",()=>step(1));
  h("seekto",d=>{au.currentTime=d.seekTime});
}
let tried=0, vis=[], cur=-1, shuffle=false, repeat=false;

function render(){
  const terms=nrm($("q").value.trim()).n.split(/\s+/).filter(Boolean), sr=$("ser").value;
  list.textContent=""; vis=[];
  T.forEach((t,i)=>{
    if(sr && t.j!==sr) return;
    if(!terms.every(x=>t.hay.includes(x))) return;
    vis.push(i); const li=document.createElement("li"), b=document.createElement("button");
    b.className="row"+(i===cur?" on":""); b.dataset.i=i;
    b.innerHTML='<span class="no"></span><img class="cv" loading="lazy" alt=""><span><span class="t"></span><span class="a"></span></span>';
    b.children[0].textContent=t.no; b.children[1].src=t.cv; b.children[1].onerror=function(){this.style.visibility="hidden"};
    hl(b.querySelector(".t"),t.title,terms); hl(b.querySelector(".a"),t.artist,terms);
    b.onclick=()=>play(i); li.appendChild(b); list.appendChild(li);
  });
  $("cnt").textContent=(terms.length||sr)?vis.length+"曲が見つかりました（全"+T.length+"曲中）":"全"+T.length+"曲";
  $("empty").hidden=vis.length>0;
}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function icon(p){$("ic").className=p?"fa-solid fa-pause":"fa-solid fa-play";$("play").setAttribute("aria-label",p?"一時停止":"再生")}
// 濁点付き文字は保存環境により NFC / NFD どちらの名前にもなるため、両方を順に試す
function srcOf(t,k){const f=[t.fn,t.fn.normalize("NFD"),t.fn.normalize("NFC")].filter((v,i,a)=>a.indexOf(v)===i);return k<f.length?"songs/"+encodeURIComponent(f[k]):null}
function play(i){
  cur=i; tried=0; const t=T[i]; $("msg").textContent=""; au.src=srcOf(t,0); upd(); au.play().catch(()=>{});
  $("nt").textContent=t.no+"  "+t.title; $("pcv").src=t.cv; $("pcv").hidden=false; document.title=t.title+" - 頭文字D THE ARCADE"; setMeta(t);
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",+r.dataset.i===i));
  const on=document.querySelector(".row.on"); if(on) on.scrollIntoView({block:"nearest"});
}
function step(d){
  const L=vis.length?vis:T.map((_,i)=>i);
  if(shuffle && d>0){let j;do{j=L[Math.floor(Math.random()*L.length)]}while(j===cur&&L.length>1);play(j);return}
  let p=L.indexOf(cur); p=p<0?(d>0?0:L.length-1):(p+d+L.length)%L.length; play(L[p]);
}
$("play").onclick=()=>{ if(cur<0) play(0); else au.paused?au.play():au.pause() };
$("next").onclick=()=>step(1);
$("prev").onclick=()=>{ if(au.currentTime>3) au.currentTime=0; else step(-1) };
$("shuf").onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute("aria-pressed",shuffle)};
$("rep").onclick=e=>{repeat=!repeat;e.currentTarget.setAttribute("aria-pressed",repeat)};
Object.entries(SER).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v;$("ser").appendChild(o)});
$("q").oninput=render; $("ser").onchange=render;
$("q").onkeydown=e=>{ if(e.key==="Escape"){e.target.value="";render()} };
au.onplay=()=>{icon(true);if(MS)MS.playbackState="playing"}; au.onpause=()=>{icon(false);if(MS)MS.playbackState="paused"};
au.onended=()=>{ if(repeat){au.currentTime=0;au.play()} else step(1) };
au.onerror=()=>{
  if(cur<0) return; const t=T[cur], n=srcOf(t,tried+1);
  if(n){ tried++; au.src=n; au.play().catch(()=>{}); return }
  $("msg").textContent="曲を読み込めません。songs フォルダに「"+t.fn+"」があるか確認してください。";
};
function fin(d){return Number.isFinite(d)&&d>0}
function upd(){
  const d=au.duration, ok=fin(d), c=Math.min(au.currentTime||0, ok?d:Infinity), p=ok?c/d*100:0;
  $("fill").style.width=p+"%"; $("dot").style.left=p+"%"; $("seek").setAttribute("aria-valuenow",Math.round(p));
  $("tm").textContent=fmt(c)+" / "+(ok?fmt(d):"--:--");
  if(MS&&ok) try{MS.setPositionState({duration:d,position:c,playbackRate:au.playbackRate||1})}catch(e){}
}
["timeupdate","durationchange","loadedmetadata","seeking","seeked","emptied"].forEach(ev=>au.addEventListener(ev,upd));
function seekTo(e){const r=$("seek").getBoundingClientRect();if(fin(au.duration)){au.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*au.duration;upd()}}
let drag=false; $("seek").onpointerdown=e=>{drag=true;e.currentTarget.setPointerCapture(e.pointerId);seekTo(e)};
$("seek").onpointermove=e=>{if(drag)seekTo(e)}; $("seek").onpointerup=()=>drag=false;
$("seek").onkeydown=e=>{ if(e.key==="ArrowRight")au.currentTime=Math.min(au.currentTime+5,fin(au.duration)?au.duration:au.currentTime+5); if(e.key==="ArrowLeft")au.currentTime=Math.max(0,au.currentTime-5) };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&e.target===document.body){e.preventDefault();$("q").focus()} if(e.code==="Space"&&e.target===document.body){e.preventDefault();$("play").click()} });
render();
</script>
</body>
</html>
