<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頭文字D THE ARCADE 楽曲プレーヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1b1f26; --surface:#242932; --line:#3a414d; --lane:#eceff2; --mute:#98a1ae;
  --tail:#e8372c; --sodium:#f2a93b; --lake:#86a3b8; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --asphalt:#e9ecef; --surface:#f7f8fa; --line:#c5cbd3; --lane:#1b1f26; --mute:#5b6572;
    --tail:#c9271d; --sodium:#a85f00; --lake:#4a6a80; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --asphalt:#e9ecef; --surface:#f7f8fa; --line:#c5cbd3; --lane:#1b1f26; --mute:#5b6572;
  --tail:#c9271d; --sodium:#a85f00; --lake:#4a6a80; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--asphalt);color:var(--lane);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.6;padding-bottom:128px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
header{max-width:860px;margin:0 auto;padding:48px 20px 20px}
h1{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;font-size:clamp(34px,8vw,64px);line-height:1.1;margin:0;font-style:italic;letter-spacing:.01em}
.lede{margin:12px 0 0;color:var(--mute);max-width:46ch}
.road{height:6px;margin:24px 0 0;background:repeating-linear-gradient(90deg,var(--lane) 0 28px,transparent 28px 52px);opacity:.55}
.tools{max-width:860px;margin:0 auto;padding:8px 20px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.cnt{width:100%;margin:2px 0 0;font-size:13px;color:var(--mute)}
mark{background:var(--sodium);color:#1b1f26;border-radius:2px;padding:0 1px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--sodium);color:var(--sodium)}
main{max-width:860px;margin:0 auto;padding:0 20px}
ol{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:44px 44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 8px 12px 0;cursor:pointer;border-left:4px solid transparent}
.row:hover{background:var(--surface)}
.row.on{border-left-color:var(--tail);background:var(--surface)}
.no{font-family:"Dela Gothic One",sans-serif;font-size:20px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.row.on .no{color:var(--tail)}
.t{display:block;font-weight:700;overflow-wrap:anywhere}
.a{display:block;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.cv{width:44px;aspect-ratio:288/336;object-fit:cover;border-radius:3px;background:var(--line);display:block}
.pv{width:40px;flex:none}
.empty{padding:32px 0;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.in{max-width:860px;margin:0 auto}
.now{display:flex;gap:12px;align-items:center}
.now b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now span{color:var(--mute);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seek{position:relative;height:22px;margin:6px 0;cursor:pointer;touch-action:none}
.seek::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;background:repeating-linear-gradient(90deg,var(--mute) 0 14px,transparent 14px 24px);opacity:.6}
.fill{position:absolute;left:0;top:9px;height:4px;width:0;background:repeating-linear-gradient(90deg,var(--lane) 0 14px,transparent 14px 24px)}
.dot{position:absolute;top:4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--tail);box-shadow:0 0 10px var(--tail)}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctl button{background:none;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.ctl button.main{width:54px;height:54px;background:var(--tail);border-color:var(--tail);color:#fff}
svg{width:20px;height:20px;fill:currentColor}
#msg{color:var(--sodium);font-size:13px;margin:6px 0 0;min-height:1em;text-align:center}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>
<body>
<header>
  <h1>頭文字D<br>THE ARCADE</h1>
  <p class="lede">ゲーム内BGMをWikiの番号順に並べたプレーヤーです。曲名を押すと再生し、終わると次の曲へ進みます。</p>
  <div class="road" aria-hidden="true"></div>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="曲名・アーティスト・番号（スペースで複数指定）" aria-label="曲を検索">
  <select id="ser" aria-label="シリーズで絞り込む"><option value="">すべてのシリーズ</option></select>
  <button class="chip" id="shuf" aria-pressed="false">シャッフル</button>
  <button class="chip" id="rep" aria-pressed="false">1曲リピート</button>
  <button class="chip" id="theme">明暗切替</button>
  <p class="cnt" id="cnt" role="status"></p>
</div>
<main><ol id="list"></ol><p class="empty" id="empty" hidden>該当する曲がありません。検索語を変えてください。</p></main>

<div class="bar">
  <div class="in">
    <div class="now"><img id="pcv" class="cv pv" alt="" hidden><b id="nt">曲を選んでください</b><span id="tm">0:00 / 0:00</span></div>
    <div class="seek" id="seek" role="slider" aria-label="再生位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
    <div class="ctl">
      <button id="prev" aria-label="前の曲"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="play" class="main" aria-label="再生"><svg viewBox="0 0 24 24" id="ic"><path d="M7 4v16l13-8z"/></svg></button>
      <button id="next" aria-label="次の曲"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <p id="msg" role="status"></p>
  </div>
</div>
<audio id="au" preload="metadata"></audio>

<script>
const RAW=`01|Dive into the SPEED|A-One Vo: AXEL.K|01
02|Waiting for you|A-One Vo: Shihori|01
03|Starlight Spada|A-One Vo: Rute|01
04|Don't stop your way|A-One Vo: あき|01
05|Good Energy Flow|A-One Vo: Nene|01
06|Super Sonic|A-One Vo: 光吉猛修|01
07|High Speed Live|A-One Vo: さちぶどう|01
08|Midnight Tournament|A-One Vo: KEN BLAST|01
09|Drive Your Ambition|A-One Vo: みぃ|01
10|Turn It Around|A-One Vo: KEN BLAST|01
11|SCRAMBLE EYES|MOTSU vs A-One|01

13|EDGE OF TIME|SOUND HOLIC Vo: 709sec.|01

16|Crazy Hot|NJK Record Vo: 坂上なち|02
17|ANGEL WiNG (Crazy REMIX with DiGiTAL WiNG)|DiGiTAL WiNG / CrazyBeats Vo: 花たん|02
18|Endless, Sleepless Night|A-One Vo: (V)・∀・(V)|02
19|STARVING RAVEN|SOUND HOLIC Vo: Nana Takahashi|02
20|Horse Power Desire|Dave Rodgers|03
21|TOFU CONNECTION|Dave Rodgers|03
22|Fever on the Road|A-One Vo: あやぽんず＊ / ytr|01
23|NITRO RAINBOW|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi|01
24|IGNITE THE POWER|SOUND HOLIC Vo: STEVIE(44MAGNUM)|01
25|Chase The Ghost|Sachi@SEGA|01
26|BURN INSIDE|TAKENOBU & KUNOICHI@SEGA|04
27|Endless Seeker|A-One Vo: Rute / あき|02
28|Fantastic World|A-One Vo: Rute|02
29|BEAT DOWN|A-One Vo: Rute|01
30|PRESERVED VAMPIRE|SOUND HOLIC Vo: Nana Takahashi|02
31|HEARTSTRINGS|DiGiTAL WiNG Vo: 花たん|02
32|No Life Queen (DJ Command Remix)|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi|02
33|DARTH KILLER|SOUND HOLIC Vo: Nana Takahashi / 709sec.|02
34|Grip & Break down !!|SOUND HOLIC Vo: Nana Takahashi|02
35|Don't Break Me Down|A-One Vo: AXEL.K|02
36|DEEP IN THE HEATWAVE|SOUND HOLIC Vo: 小寺可南子|01
37|ロミオとシンデレラ|doriko Vo: 初音ミク|05
38|ネトゲ廃人シュプレヒコール|さつき が てんこもり Vo: 初音ミク|05
39|テオ|Omoi Vo: 初音ミク|05
40|ロストワンの号哭|Neru Vo: 鏡音リン|05
41|孤独の果て|光収容 Vo: 鏡音リン|05
42|右肩の蝶|のりぴー Vo: 鏡音レン|05
43|ルカルカ★ナイトフィーバー|samfree Vo: 巡音ルカ|05
44|ワールズエンド・ダンスホール|wowaka Vo: 初音ミク / 巡音ルカ|05
45|アカツキアライヴァル|Last Note. Vo: 初音ミク / 巡音ルカ|05
46|Asterist|DiGiTAL WiNG Vo: ふうか|01
47|PARAMETERS|DiGiTAL WiNG Vo: 沙|01
48|IMPACT|Usao feat.光吉猛修|06
49|POTENTIAL|TAG|06
50|We Gonna Journey|Queen P.A.L.|06
52|Set Me Free Babe|Richard Cottle|07
53|God Bless You!!|A-One Vo: NAGISA|02
54|Love Thief|CrazyBeats Vo: 加藤ありさ|02
55|Veiling Shooter|A-One Vo: 花たん|02
56|Twin Blade|A-One Vo: Rute / あき|01
57|GET IN THE GROOVE|DJ Command(Eurobeat Union) feat. Okogeeechann|02
58|SOUL 2 DIVIDE|SOUND HOLIC vs ZYTOKINE Vo: 星野奏子|02
59|00 HEAVEN|SOUND HOLIC vs Eurobeat Union Vo: Nana Takahashi / 709sec.|02
60|Death Blossom|REDALiCE feat. 野宮あゆみ|02
61|Necrophantasia|SOUND HOLIC Vo: YURiCa / 花たん|02
62|Wandering Soul|DiGiTAL WiNG with 空音|02
63|New Starlight|DiGiTAL WiNG Vo: 空音|01
64|Catch the Wave|livetune Vo: 初音ミク|05
65|ロキ|みきとP Vo: 鏡音リン / みきとP|05
66|ダブルラリアット|アゴアニキ Vo: 巡音ルカ|05
67|VANTAGE POINT|SOUND HOLIC feat. Nana Takahashi|01
68|LUNATIC DOLL|DJ Command (Eurobeat Union) Vo: Cocoa|02
69|Tiara is gone|CrazyBeats Vo: KIHOW|02
70|sweet little sister|Silver Forest Vo: さゆり|02
77|Dark Diver|emon(Tes.) Vo: ねんね|06
78|C & B|PSYQUI Vo: Such|06
79|MUSIC PЯAYER|A-One Vo: Rute / あき|06
80|Elusive Enforcer|K-forest vs. Reku Mochizuki|06
L01|JUNGLE FIRE feat. MOTSU|芹澤 優|08`;

const SER={"01":"THE ARCADE オリジナル","02":"東方","03":"Dave Rodgers","04":"20th Anniversary","05":"VOCALOID","06":"CHUNITHM","07":"Hot-Version","08":"MF Ghost"};
function nrm(s){let n="",map=[];for(let i=0;i<s.length;i++){const c=s[i].normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,x=>String.fromCharCode(x.charCodeAt(0)-96));for(const ch of c){n+=ch;map.push(i)}}return {n,map}}
function hl(el,text,terms){
  const {n,map}=nrm(text),r=[];
  terms.forEach(w=>{for(let k=n.indexOf(w);k>=0;k=n.indexOf(w,k+w.length)) r.push([map[k],map[k+w.length-1]+1])});
  r.sort((a,b)=>a[0]-b[0]);let p=0;
  for(const [a,b] of r){ if(b<=p) continue; const s0=Math.max(a,p);
    if(s0>p) el.append(text.slice(p,s0)); const m=document.createElement("mark"); m.textContent=text.slice(s0,b); el.append(m); p=b; }
  el.append(text.slice(p));
}
const T=RAW.split("\n").map(l=>{const [no,title,artist,j]=l.split("|");
  const label=no[0]==="L"?"LIMITED"+no.slice(1):no;
  return {no,j,hay:nrm(no+" "+title+" "+artist+" "+SER[j]).n,no,title,artist,cv:"artwork/T_Common_CDJacket_"+j+"_Big.png",fn:label+"_"+title+".ogg"};});
const $=id=>document.getElementById(id), au=$("au"), list=$("list");
let tried=0, vis=[], cur=-1, shuffle=false, repeat=false;

function render(){
  const terms=nrm($("q").value.trim()).n.split(/\s+/).filter(Boolean), sr=$("ser").value;
  list.textContent=""; vis=[];
  T.forEach((t,i)=>{
    if(sr && t.j!==sr) return;
    if(!terms.every(x=>t.hay.includes(x))) return;
    vis.push(i); const li=document.createElement("li"), b=document.createElement("button");
    b.className="row"+(i===cur?" on":""); b.dataset.i=i;
    b.innerHTML='<span class="no"></span><img class="cv" loading="lazy" alt=""><span><span class="t"></span><span class="a"></span></span>';
    b.children[0].textContent=t.no; b.children[1].src=t.cv; b.children[1].onerror=function(){this.style.visibility="hidden"};
    hl(b.querySelector(".t"),t.title,terms); hl(b.querySelector(".a"),t.artist,terms);
    b.onclick=()=>play(i); li.appendChild(b); list.appendChild(li);
  });
  $("cnt").textContent=(terms.length||sr)?vis.length+"曲が見つかりました（全"+T.length+"曲中）":"全"+T.length+"曲";
  $("empty").hidden=vis.length>0;
}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function icon(p){$("ic").innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$("play").setAttribute("aria-label",p?"一時停止":"再生")}
// 濁点付き文字は保存環境により NFC / NFD どちらの名前にもなるため、両方を順に試す
function srcOf(t,k){const f=[t.fn,t.fn.normalize("NFD"),t.fn.normalize("NFC")].filter((v,i,a)=>a.indexOf(v)===i);return k<f.length?"songs/"+encodeURIComponent(f[k]):null}
function play(i){
  cur=i; tried=0; const t=T[i]; $("msg").textContent=""; au.src=srcOf(t,0); au.play().catch(()=>{});
  $("nt").textContent=t.no+"  "+t.title; $("pcv").src=t.cv; $("pcv").hidden=false; document.title=t.title+" - 頭文字D THE ARCADE";
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",+r.dataset.i===i));
  const on=document.querySelector(".row.on"); if(on) on.scrollIntoView({block:"nearest"});
}
function step(d){
  const L=vis.length?vis:T.map((_,i)=>i);
  if(shuffle && d>0){let j;do{j=L[Math.floor(Math.random()*L.length)]}while(j===cur&&L.length>1);play(j);return}
  let p=L.indexOf(cur); p=p<0?(d>0?0:L.length-1):(p+d+L.length)%L.length; play(L[p]);
}
$("play").onclick=()=>{ if(cur<0) play(0); else au.paused?au.play():au.pause() };
$("next").onclick=()=>step(1);
$("prev").onclick=()=>{ if(au.currentTime>3) au.currentTime=0; else step(-1) };
$("shuf").onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute("aria-pressed",shuffle)};
$("rep").onclick=e=>{repeat=!repeat;e.currentTarget.setAttribute("aria-pressed",repeat)};
$("theme").onclick=()=>{const d=document.documentElement,l=getComputedStyle(d).colorScheme==="light";d.dataset.theme=l?"dark":"light"};
Object.entries(SER).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v;$("ser").appendChild(o)});
$("q").oninput=render; $("ser").onchange=render;
$("q").onkeydown=e=>{ if(e.key==="Escape"){e.target.value="";render()} };
au.onplay=()=>icon(true); au.onpause=()=>icon(false);
au.onended=()=>{ if(repeat){au.currentTime=0;au.play()} else step(1) };
au.onerror=()=>{
  if(cur<0) return; const t=T[cur], n=srcOf(t,tried+1);
  if(n){ tried++; au.src=n; au.play().catch(()=>{}); return }
  $("msg").textContent="曲を読み込めません。songs フォルダに「"+t.fn+"」があるか確認してください。";
};
au.ontimeupdate=()=>{
  const p=au.duration?au.currentTime/au.duration*100:0;
  $("fill").style.width=p+"%"; $("dot").style.left=p+"%"; $("seek").setAttribute("aria-valuenow",Math.round(p));
  $("tm").textContent=fmt(au.currentTime)+" / "+fmt(au.duration);
};
function seekTo(e){const r=$("seek").getBoundingClientRect();if(au.duration)au.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*au.duration}
let drag=false; $("seek").onpointerdown=e=>{drag=true;e.currentTarget.setPointerCapture(e.pointerId);seekTo(e)};
$("seek").onpointermove=e=>{if(drag)seekTo(e)}; $("seek").onpointerup=()=>drag=false;
$("seek").onkeydown=e=>{ if(e.key==="ArrowRight")au.currentTime+=5; if(e.key==="ArrowLeft")au.currentTime-=5 };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&e.target===document.body){e.preventDefault();$("q").focus()} if(e.code==="Space"&&e.target===document.body){e.preventDefault();$("play").click()} });
render();
</script>
</body>
</html>
